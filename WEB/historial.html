<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Resúmenes - Resumen PDF</title>
<style>
/* ==========================================================
   SISTEMA DE DISEÑO — Resumen PDF (uso empresarial)
   Paleta:  tinta #1C2430 · papel #F6F4EF · línea #DCD7CA
            verde archivo #0F5C4E (acción primaria)
            bronce #A97D46 (acento secundario, uso escaso)
   Tipografía: "Source Serif 4" (títulos, tono documental)
               "Inter" (interfaz y texto de trabajo)
   ========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap');

:root {
    --ink: #1c2430;
    --ink-soft: #4a5568;
    --paper: #f6f4ef;
    --paper-raised: #ffffff;
    --line: #dcd7ca;
    --line-strong: #c7c0ac;
    --accent: #0f5c4e;
    --accent-dark: #0b4038;
    --accent-tint: #e7efec;
    --bronze: #a97d46;
    --error: #9a3324;
    --error-tint: #f7ebe8;
    --success: #2f6f4e;
    --success-tint: #eaf3ec;
    --radius: 4px;
    --shadow-card: 0 1px 2px rgba(28, 36, 48, 0.06), 0 8px 24px rgba(28, 36, 48, 0.06);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.container {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px;
}

h1, h2, h3 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.01em;
}

/* ===========================
   HEADER — cabecera tipo membrete
   =========================== */

header {
    background: var(--ink);
    color: #f6f4ef;
    padding: 1.15rem 0;
    border-bottom: 3px solid var(--accent);
}

header .container {
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-align: center;
}

.logo span {
    color: #7fc9b8;
    font-weight: 700;
}

/* ===========================
   NAVBAR
   =========================== */

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.85rem 24px;
    color: var(--ink);
    font-weight: 500;
    flex-wrap: wrap;
    gap: 0.75rem;
    border-bottom: 1px solid var(--line);
    background: var(--paper-raised);
}

.navbar-actions {
    display: flex;
    gap: 0.6rem;
}

.navbar-actions .btn {
    padding: 0.5rem 1rem;
    font-size: 0.88rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
}

/* ===========================
   MAIN CONTENT
   =========================== */

.main-content {
    flex: 1;
    padding: 2.5rem 0;
}

/* ===========================
   UPLOAD SECTION
   =========================== */

.upload-section {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 400px;
}

.upload-box {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 2.25rem;
    width: 100%;
}

.upload-box h1 {
    color: var(--ink);
    font-size: 1.6rem;
    margin-bottom: 0.4rem;
    text-align: center;
}

.upload-box .subtitle {
    text-align: center;
    color: var(--ink-soft);
    margin-bottom: 2rem;
    font-size: 1rem;
}

/* ===========================
   AUTENTICACIÓN (login / registro)
   =========================== */

.auth-box {
    max-width: 400px;
    margin: 0 auto;
}

.auth-switch {
    text-align: center;
    margin-top: 1.5rem;
    color: var(--ink-soft);
    font-size: 0.92rem;
}

.auth-switch a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
}

.auth-switch a:hover {
    border-bottom-color: var(--accent);
}

/* ===========================
   DROP ZONE
   =========================== */

.drop-zone {
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    padding: 2.75rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease;
    background-color: var(--paper);
    margin-bottom: 1.75rem;
}

.drop-zone:hover {
    border-color: var(--accent);
    background-color: var(--accent-tint);
}

.drop-zone.drag-over {
    border-color: var(--accent);
    background-color: var(--accent-tint);
    border-style: solid;
}

.drop-content {
    pointer-events: none;
}

.upload-icon {
    font-size: 2.25rem;
    margin-bottom: 0.75rem;
    opacity: 0.8;
}

.drop-zone p {
    margin: 0.4rem 0;
    color: var(--ink);
}

.drop-zone p strong {
    color: var(--ink);
}

.drop-zone p.small {
    font-size: 0.88rem;
    color: var(--ink-soft);
}

.drop-zone .link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
    pointer-events: all;
}

.drop-zone .link:hover {
    text-decoration: underline;
}

.drop-zone .file-info {
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-top: 0.85rem;
}

/* ===========================
   FORMS
   =========================== */

.upload-form {
    background-color: var(--paper);
    border: 1px solid var(--line);
    padding: 1.75rem;
    border-radius: var(--radius);
}

.form-group {
    margin-bottom: 1.35rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.4rem;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--ink);
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 0.7rem 0.8rem;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--paper-raised);
    color: var(--ink);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
}

.form-group small {
    display: block;
    margin-top: 0.35rem;
    color: var(--ink-soft);
    font-size: 0.82rem;
}

/* Configuración avanzada — oculta por defecto, sin exponer detalles
   técnicos de infraestructura en la pantalla principal */
.advanced-settings {
    margin-bottom: 1.35rem;
}

.advanced-toggle {
    background: none;
    border: none;
    padding: 0;
    color: var(--ink-soft);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
}

.advanced-toggle:hover {
    color: var(--ink);
}

.advanced-toggle .chevron {
    transition: transform 0.15s ease;
    font-size: 0.7rem;
}

.advanced-toggle[aria-expanded="true"] .chevron {
    transform: rotate(90deg);
}

.advanced-panel {
    display: none;
    margin-top: 0.9rem;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper-raised);
}

.advanced-panel.open {
    display: block;
}

/* ===========================
   BUTTONS
   =========================== */

.btn {
    padding: 0.75rem 1.4rem;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.btn-primary {
    width: 100%;
    background: var(--accent);
    color: #ffffff;
    margin-top: 0.75rem;
}

.btn-primary:hover:not(:disabled) {
    background: var(--accent-dark);
}

.btn-primary:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.btn-secondary {
    background: var(--paper-raised);
    color: var(--ink);
    border: 1px solid var(--line-strong);
}

.btn-secondary:hover {
    background: var(--paper);
    border-color: var(--ink-soft);
}

/* ===========================
   FILE INFO BOX
   =========================== */

.file-info-box {
    background-color: var(--success-tint);
    border-left: 3px solid var(--success);
    padding: 0.9rem 1rem;
    border-radius: var(--radius);
    margin-top: 1rem;
    color: var(--accent-dark);
}

.file-info-box p {
    margin: 0.25rem 0;
}

/* ===========================
   RESULTS SECTION
   =========================== */

.results-section {
    min-height: 400px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
}

.results-box {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 2.25rem;
    width: 100%;
}

.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.75rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1rem;
}

.results-header h2 {
    color: var(--ink);
    font-size: 1.3rem;
}

/* ===========================
   LOADING STATE
   =========================== */

.loading-state {
    text-align: center;
    padding: 3rem 1rem;
}

.spinner {
    border: 3px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 1rem;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading-state p {
    color: var(--ink-soft);
    font-size: 1rem;
}

/* ===========================
   SUMMARY OUTPUT
   =========================== */

.summary-content {
    display: flex;
    flex-direction: column;
}

.summary-meta {
    background: var(--paper);
    padding: 0.9rem 1rem;
    border-radius: var(--radius);
    margin-bottom: 1.5rem;
    border-left: 3px solid var(--accent);
}

.summary-meta p {
    margin: 0.25rem 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
}

.summary-text {
    margin-bottom: 1rem;
}

.summary-text h3 {
    color: var(--ink);
    font-size: 1.1rem;
    margin-bottom: 0.85rem;
}

.summary-box {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 1.4rem;
    border-radius: var(--radius);
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 500px;
    overflow-y: auto;
}

.summary-actions {
    display: flex;
    gap: 0.85rem;
    margin-top: 1.5rem;
}

.summary-actions .btn {
    flex: 1;
}

/* Estado de guardado en el historial (backend) */
.save-status {
    font-size: 0.88rem;
    margin: 0.5rem 0 0;
    min-height: 1.2em;
    color: var(--ink-soft);
}

.save-status-ok {
    color: var(--success);
}

.save-status-error {
    color: var(--error);
}

/* ===========================
   ERROR STATE
   =========================== */

.error-box {
    background: var(--error-tint);
    border-left: 3px solid var(--error);
    padding: 1.25rem;
    border-radius: var(--radius);
    color: var(--error);
}

.error-box p {
    margin: 0;
}

.error-details {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--ink-soft);
}

.error-details summary {
    cursor: pointer;
    font-weight: 500;
}

.error-details pre {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 0.75rem;
    border-radius: var(--radius);
    overflow-x: auto;
    margin-top: 0.6rem;
    white-space: pre-wrap;
}

/* ===========================
   HISTORIAL (tabla de documentos guardados)
   =========================== */

.historial-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1.25rem;
}

.historial-table th,
.historial-table td {
    text-align: left;
    padding: 0.9rem 0.9rem;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
    vertical-align: middle;
}

.historial-table th {
    color: var(--ink-soft);
    font-size: 0.78rem;
    font-weight: 600;
    padding-bottom: 0.6rem;
}

.historial-table tbody tr {
    transition: background-color 0.12s ease;
}

.historial-table tbody tr:hover {
    background-color: var(--paper);
}

.historial-table tbody tr:last-child td {
    border-bottom: none;
}

.doc-name {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    max-width: 280px;
}

.doc-icon {
    flex-shrink: 0;
    font-size: 1rem;
    opacity: 0.75;
}

.doc-name-text {
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.col-muted {
    color: var(--ink-soft);
    font-size: 0.85rem;
    white-space: nowrap;
}

.badge {
    display: inline-block;
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 500;
    white-space: nowrap;
}

.badge-lang {
    background: var(--accent-tint);
    color: var(--accent-dark);
}

.badge-model {
    background: #f2e9db;
    color: #7a5a28;
}

.row-actions {
    display: flex;
    gap: 0.4rem;
}

.icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    color: var(--ink-soft);
    font-size: 0.95rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    padding: 0;
}

.icon-btn:hover {
    background: var(--accent-tint);
    border-color: var(--accent);
    color: var(--accent-dark);
}

.icon-btn-danger:hover {
    background: var(--error-tint);
    border-color: var(--error);
    color: var(--error);
}

.empty-state {
    text-align: center;
    color: var(--ink-soft);
    padding: 2rem;
}

/* Buscador por nombre de PDF (historial) */
.search-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
}

.search-bar input {
    flex: 1;
    min-width: 200px;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-family: inherit;
}

.search-bar input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
}

.search-bar .btn {
    white-space: nowrap;
}

/* ===========================
   ASISTENTE (widget flotante)
   =========================== */

.assistant-toggle-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--ink);
    color: #f6f4ef;
    border: none;
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(28, 36, 48, 0.28);
    z-index: 1000;
    transition: transform 0.15s ease, background-color 0.15s ease;
}

.assistant-toggle-btn:hover {
    transform: translateY(-2px);
    background: var(--accent-dark);
}

.assistant-panel {
    position: fixed;
    bottom: 92px;
    right: 24px;
    width: 340px;
    max-width: calc(100vw - 48px);
    height: 460px;
    max-height: calc(100vh - 140px);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 12px 32px rgba(28, 36, 48, 0.22);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
}

.assistant-header {
    background: var(--ink);
    color: #f6f4ef;
    padding: 0.9rem 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 0.95rem;
}

.assistant-header-actions {
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.assistant-close-btn {
    background: none;
    border: none;
    color: #f6f4ef;
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
    opacity: 0.8;
}

.assistant-close-btn:hover {
    opacity: 1;
}

.assistant-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    background: var(--paper);
}

.assistant-msg {
    padding: 0.6rem 0.85rem;
    border-radius: var(--radius);
    font-size: 0.88rem;
    line-height: 1.45;
    max-width: 85%;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.assistant-msg-bot {
    background: var(--accent-tint);
    color: var(--ink);
    align-self: flex-start;
    border: 1px solid var(--line);
}

.assistant-msg-user {
    background: var(--ink);
    color: #f6f4ef;
    align-self: flex-end;
}

.assistant-input-row {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem;
    border-top: 1px solid var(--line);
    background: var(--paper-raised);
}

.assistant-input-row input {
    flex: 1;
    padding: 0.6rem 0.9rem;
    border: 1px solid var(--line-strong);
    border-radius: 20px;
    font-size: 0.88rem;
    font-family: inherit;
}

.assistant-input-row input:focus {
    outline: none;
    border-color: var(--accent);
}

.assistant-input-row .btn {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Ajustes del asistente (antes visibles como campos URL/modelo);
   ahora agrupados detrás de un icono discreto para no exponer
   infraestructura al usuario final. */
.assistant-settings-toggle {
    background: none;
    border: none;
    color: rgba(246, 244, 239, 0.75);
    font-size: 0.95rem;
    cursor: pointer;
    line-height: 1;
    padding: 0.15rem;
}

.assistant-settings-toggle:hover {
    color: #f6f4ef;
}

.assistant-settings {
    display: none;
    gap: 0.4rem;
    padding: 0.6rem;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
}

.assistant-settings.open {
    display: flex;
}

.assistant-settings input {
    flex: 1;
    min-width: 0;
    padding: 0.4rem;
    font-size: 0.72rem;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    font-family: inherit;
}

/* ===========================
   FOOTER
   =========================== */

footer {
    background: var(--ink);
    color: rgba(246, 244, 239, 0.75);
    text-align: center;
    padding: 1.25rem 0;
    margin-top: auto;
    font-size: 0.85rem;
}

footer p {
    margin: 0;
}

/* ===========================
   RESPONSIVE
   =========================== */

@media (max-width: 768px) {
    .upload-box,
    .results-box {
        padding: 1.5rem;
    }

    .drop-zone {
        padding: 2rem 1rem;
    }

    .upload-icon {
        font-size: 2rem;
    }

    .results-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
    }

    .results-header .btn {
        width: 100%;
    }

    .summary-actions {
        flex-direction: column;
    }

    .navbar {
        flex-direction: column;
        align-items: flex-start;
    }

    .navbar-actions {
        width: 100%;
    }

    .navbar-actions .btn {
        flex: 1;
        justify-content: center;
    }

    .historial-table {
        font-size: 0.85rem;
    }

    .historial-table th,
    .historial-table td {
        padding: 0.6rem 0.5rem;
    }

    .doc-name {
        max-width: 140px;
    }

    .col-muted {
        white-space: normal;
    }

    .assistant-panel {
        right: 12px;
        left: 12px;
        width: auto;
        bottom: 90px;
        height: 65vh;
    }

    .assistant-toggle-btn {
        right: 16px;
        bottom: 16px;
    }
}

</style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="logo">📄 Resumen <span>PDF</span></div>
        </div>
    </header>

    <!-- NAVBAR: usuario logueado + volver a generar + cerrar sesión -->
    <div class="navbar container">
        <span id="userGreeting"></span>
        <div class="navbar-actions">
            <a href="index.html" class="btn btn-secondary">📄 Generar resumen</a>
            <button id="logoutBtn" class="btn btn-secondary">🚪 Cerrar sesión</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="container main-content">
        <section class="upload-section" style="align-items:flex-start;">
            <div class="upload-box" style="max-width:100%;">
                <h1>Mis Resúmenes</h1>

                <!-- BUSCADOR POR NOMBRE DE PDF -->
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre de archivo...">
                    <button id="searchBtn" type="button" class="btn btn-secondary">🔍 Buscar</button>
                    <button id="clearSearchBtn" type="button" class="btn btn-secondary">✕ Limpiar</button>

                <!-- LISTA / TABLA DE DOCUMENTOS -->
                <div id="listContainer">

                        </div>

                        </div>
                        <div class="summary-actions">

                        </div>
                    </div>
                </div>
            </div>
        </section>
